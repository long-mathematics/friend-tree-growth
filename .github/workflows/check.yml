name: Exact checks and manuscripts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run finite exact-arithmetic checks
        run: python3 scripts/run_checks.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-check-reports
          path: build/verification/

  manuscripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install LaTeX packages
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Build all manuscripts
        run: python3 scripts/build_papers.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-drafts
          path: |
            friend_tree_growth.pdf
            local_redirection_irrationality.pdf
            friend_tree_transcendence_progress.pdf
            build/papers/build_report.json
