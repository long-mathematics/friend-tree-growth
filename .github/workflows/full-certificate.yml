name: Full original-model certificate

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'verification/**'
      - '.github/workflows/full-certificate.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'verification/**'
      - '.github/workflows/full-certificate.yml'

permissions:
  contents: read

jobs:
  full-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install exact-checker dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Reproduce the pinned upstream certificate and verify the improvement
        run: python3 scripts/verify_bound.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-certificate-reports
          path: build/verification/
